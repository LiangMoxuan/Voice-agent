<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智语外呼</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; padding: 40px; max-width: 760px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .muted { color: #777; font-size: 14px; }
    button { padding: 10px 18px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; }
    #status { margin-top: 16px; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; }
    .card { border: 1px solid #eee; border-radius: 10px; padding: 16px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>智语外呼</h1>
  <p class="muted">骨架已就绪（Day1）。语音链路由 A 接入，Agent 由 B 接入。</p>

  <div class="card">
    <button id="btn" disabled>发起模拟外呼（待接入）</button>
    <div id="status">后端健康检查：检测中…</div>
  </div>

  <script>
    fetch('/health').then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('status').textContent = '后端健康检查：' + JSON.stringify(d);
    }).catch(function (e) {
      document.getElementById('status').textContent = '后端未连通：' + e;
    });
  </script>
  <!-- Day3 起由 A 接入 app.js（WebRTC / WebSocket 音频） -->
</body>
</html>
