# 必说/禁语词表（C 出通用版，官方资料包到手后整份替换为 official-v1）
# 说明：本文件是"数据"，改规则只改这里，不动 guardrails.py。
#       分类标签写在注释里，供人核对；代码只读 banned / must_say / privacy_pattern。
version: generic-v1.1

# 【禁语】命中任一即整句替换为兜底话术，绝不下发原文
banned:
  # 一、绝对化承诺（任何"保证/绝对/百分之百"的表述都不可接受）
  - 绝对保证
  - 绝对安全
  - 绝对没问题
  - 百分之百
  - "100%"
  - 一定能办成

  # 二、虚假保证（平台无权替第三方作出承诺）
  - 我保证
  - 包您满意
  - 无条件退款
  - 内部渠道
  - 唯一官方渠道
  - 官方内部人员

  # 三、诱导施压（制造虚假紧迫感）
  - 最后一次机会
  - 不买就亏了
  - 错过就没了
  - 限时秒杀
  - 必须今天办
  - 不办就停用

  # 四、金融收益承诺（本业务不涉及，出现即越界）
  - 稳赚不赔
  - 保本保收益
  - 肯定赚钱

  # 五、医疗效果承诺（本业务不涉及，出现即越界）
  - 包治
  - 药到病除

  # 六、辱骂与歧视（人格侮辱、地域/年龄/性别/疾病歧视）
  - 你懂什么
  - 闭嘴
  - 滚出去
  - 老年人就是
  - 外地人就是

  # 七、索要敏感信息（客服永不主动索取）
  - 验证码发我
  - 银行卡密码
  - 把身份证号发

  # 注：涉政、涉黄、涉暴等红线词表，待官方"话术规范与合规红线"资料包到手后
  #     按 official-v1 整份替换，不在通用版中自行列举。

# 【必说】按状态检查：该状态的话术必须包含对应内容，缺失即拦截并补全
must_say:
  GREETING: "(京东)?客服.*(身份|小智)"
  IDENTITY_CONFIRM: "(本人|您本人|是您)"
  REQUIREMENT: "(会员|到期|意向)"
  SOLUTION: "9折.*12个月|到期(前)?提醒"
  CONFIRM: "(登记|可以吗)"
  WRITEBACK: "(登记|已记录)"
  COMPLETED: "再见|感谢"
  HUMAN_TRANSFER: "(转接|人工)"

# 【隐私】回复里出现以下任一格式，视为泄露真实个人信息
#   手机号 / 身份证号 / 银行卡号（长数字串）
privacy_pattern: "1[3-9]\\d{9}|\\d{17}[\\dXx]|\\d{16,19}"

# 【兜底】命中任一问题后下发的替代话术
fallback_text: "不好意思，这个问题我帮您转接人工客服，请稍等。"

# 【转人工】触发条件（B 的 Agent 据此判断，C 的质检据此核对）
transfer_to_human:
  consecutive_fail: 3
  refuse_times: 2
  tool_unavailable: 1
